<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imprenta FabrixioA1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --tinta: #10211b;
      --tinta-suave: #41524b;
      --verde: #038162;
      --verde-osc: #026a50;
      --lima: #b8c412;
      --papel: #f2f5f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Archivo", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--tinta);
      background: var(--papel);
    }
    .ic {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
 
    /* Cabecera */
    .cabecera {
      background: #fff;
      border-bottom: 6px solid var(--lima);
      padding: 28px 16px 32px;
      text-align: center;
    }
    .logo {
      display: block;
      margin: 0 auto 16px;
      width: min(220px, 60vw);
      height: auto;
    }
    .lema {
      margin: 0 auto 20px;
      max-width: 30ch;
      font-size: 18px;
      color: var(--tinta-suave);
    }
    .subtitulo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--verde);
      color: #fff;
      font-weight: 700;
      animation: flotar 2.4s ease-in-out infinite;
    }
    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
 
    /* Catálogo */
    .catalogo {
      max-width: 860px;
      margin: 0 auto;
      padding: 36px 16px 110px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 44px 32px;
    }
 
    /* Imagen como prueba de imprenta, con marcas de corte en las esquinas */
    .proof {
      --m: var(--tinta);
      --g: linear-gradient(var(--m), var(--m));
      position: relative;
      display: block;
      width: 100%;
      padding: 16px;
      border: 0;
      cursor: zoom-in;
      background-color: #fff;
      background-image: var(--g), var(--g), var(--g), var(--g), var(--g), var(--g), var(--g), var(--g);
      background-repeat: no-repeat;
      background-size: 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px;
      background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%;
    }
    .proof:hover { --m: var(--verde); }
    .proof img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: contain;
    }
    .etiqueta {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--lima);
      color: var(--tinta);
      font-size: 13px;
      font-weight: 700;
    }
 
    .producto h2 {
      margin: 18px 0 6px;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
      font-stretch: 118%;
    }
    .producto p {
      margin: 0;
      max-width: 42ch;
      color: var(--tinta-suave);
    }
    .producto .precio {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--verde);
    }
    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding: 13px 16px;
      border-radius: 12px;
      background: var(--verde);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s;
    }
    .boton:hover { background: var(--verde-osc); }
 
    /* Botón flotante de WhatsApp */
    .flotante {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--verde);
      color: #fff;
      box-shadow: 0 6px 18px rgba(16, 33, 27, 0.28);
    }
    .flotante .ic { width: 26px; height: 26px; }
 
    /* Imagen ampliada */
    dialog {
      padding: 0;
      border: 0;
      background: transparent;
      max-width: 100vw;
      max-height: 100vh;
      overflow: visible;
    }
    dialog::backdrop { background: rgba(16, 33, 27, 0.88); }
    dialog img {
      display: block;
      max-width: 92vw;
      max-height: 90vh;
      border-radius: 4px;
      cursor: zoom-out;
    }
 
    .proof:focus-visible,
    .boton:focus-visible,
    .flotante:focus-visible {
      outline: 3px solid var(--verde);
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      .subtitulo { animation: none; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="chat" viewBox="0 0 24 24">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </symbol>
  </svg>
 
  <header class="cabecera">
    <img class="logo" src="LOGO IMPRENTA.png" alt="Imprenta FabrixioA1">
    <p class="lema">Llaveros y tazas para toda ocasión.</p>
    <p class="subtitulo"><svg class="ic" aria-hidden="true"><use href="#chat"/></svg>Haz tu pedido por WhatsApp</p>
  </header>
 
  <main id="catalogo" class="catalogo"></main>
 
  <a class="flotante" id="flotante" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
    <svg class="ic" aria-hidden="true"><use href="#chat"/></svg>
  </a>
 
  <dialog id="visor"><img alt=""></dialog>
 
<script>
  const numero = "51964224155"; // Tu número de WhatsApp con código de país
 
  // Campos opcionales: precio (número) y etiqueta (texto corto sobre la imagen)
  const productos = [
    { nombre: "Llaveros destapador", descripcion: "Personalizados con tu foto, logo o diseño.", imagen: "llaverosdestapador.jpeg", etiqueta: "Por mayor y menor" },
    { nombre: "Tazas de cumpleaños", descripcion: "Un detalle para celebrar, con el diseño que elijas.", imagen: "tazacumpleaños.jpeg" },
    { nombre: "Tazas personalizadas", descripcion: "Con tu nombre, foto o diseño.", imagen: "tazaspersonalizadas.jpeg" },
    { nombre: "Tazas por ciento", descripcion: "Ideal para pedidos por ciento.", imagen: "tazasporciento.jpeg" }
  ];
 
  const contenedor = document.getElementById("catalogo");
 
  contenedor.innerHTML = productos.map(function (p) {
    const mensaje = "Hola, quiero pedir " + p.nombre;
    const link = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);
    const etiqueta = p.etiqueta ? `<span class="etiqueta">${p.etiqueta}</span>` : "";
    const precio = p.precio !== undefined ? `<p class="precio">S/ ${p.precio.toFixed(2)}</p>` : "";
 
    return `
      <article class="producto">
        <button class="proof" type="button" data-src="${p.imagen}" data-alt="${p.nombre}" aria-label="Ampliar imagen de ${p.nombre}">
          <img src="${p.imagen}" alt="${p.nombre}" loading="lazy">
          ${etiqueta}
        </button>
        <h2>${p.nombre}</h2>
        <p>${p.descripcion}</p>
        ${precio}
        <a class="boton" href="${link}" target="_blank" rel="noopener">
          <svg class="ic" aria-hidden="true"><use href="#chat"/></svg>Pedir por WhatsApp
        </a>
      </article>
    `;
  }).join("");
 
  // Botón flotante
  document.getElementById("flotante").href =
    "https://wa.me/" + numero + "?text=" + encodeURIComponent("Hola, quiero hacer una consulta");
 
  // Ampliar imagen al tocarla
  const visor = document.getElementById("visor");
  const visorImg = visor.querySelector("img");
  contenedor.addEventListener("click", function (e) {
    const b = e.target.closest(".proof");
    if (!b) return;
    visorImg.src = b.dataset.src;
    visorImg.alt = b.dataset.alt;
    visor.showModal();
  });
  visor.addEventListener("click", function () { visor.close(); });
</script>
</body>
</html>
